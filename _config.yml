footer_content: >-
  Bowtie Risk Visual for Power BI · Prana IT Solutions Ltd ·
  <a href="mailto:support@pranaits.com">support@pranaits.com</a> ·
  <a href="privacy">Privacy</a> · <a href="third-party-notices">Third-party notices</a>

exclude:
  - README.md
